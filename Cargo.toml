[package]
name        = "smflog"
version     = "1.0.0"
edition     = "2024"
authors     = ["zxelzy <elzyproot@protonmail.com>"]
description = "A Python logging extension built to handle massive log volumes without compromise, with high-speed terminal output separated from structured SQLite debug caching."
readme      = "README.md"
license     = "GPL-2.0-only"
repository  = "https://github.com/StormWorld0/smflog"
keywords    = ["debugging", "ffi", "developer-tools", "high-performance", "logging", "logger", "pyo3", "python", "rust", "sqlite"]

[lib]
name = "smf"
crate-type = ["cdylib"]

[dependencies]
# abi3-py39 ensure to match minimum Python version 3.9
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
dirs = "6.0.0"
rand = "0.10.2"
rusqlite = { version = "0.40", features = ["bundled"] }

[profile.release]
lto = true            # Link-Time Optimization (optimization across .rs files)
codegen-units = 1     # Reduce compilation parallelization for maximum optimization
panic = "abort"       # Reduce binary size & speed up execution on crash
strip = true          # Remove debug symbols to make .so files lighter
