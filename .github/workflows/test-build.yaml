name: Maturin Build Test (Dry-Run)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Postur Keamanan: Least Privilege untuk GITHUB_TOKEN
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Compilation Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Rust Cache Manager
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-pep517-test

      - name: Install PEP 517 Build Frontend
        run: python -m pip install --upgrade pip build

      # Eksekusi build murni berdasarkan konfigurasi pyproject.toml
      # Hasil build (sdist dan wheel) akan di-generate di folder ./dist/
      # dan otomatis musnah saat runner selesai (karena tidak di-upload).
      - name: Build via pyproject.toml
        run: python -m build
        
