name: Maturin Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Compilation & Artifact Generation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Postur Keamanan: Least Privilege untuk fase build murni
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Rust Cache Manager
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-pep517

      - name: Install PEP 517 Build Frontend
        run: python -m pip install --upgrade pip build

      # Generate sdist (.tar.gz) dan wheels (.whl)
      - name: Build via pyproject.toml
        run: python -m build

      # Ekspor artifact dari container runner untuk diakumulasi di job publish
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-artifacts-${{ matrix.os }}
          path: dist/*

  publish:
    name: Publish to PyPI
    needs: build
    # Gatekeeper: Job ini HANYA berjalan jika dipicu oleh Git Tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    
    # Postur Keamanan: OIDC Identity Federation (Trusted Publishing)
    # Memerlukan 'id-token: write' agar GitHub dapat merequest ephemeral token ke PyPI
    permissions:
      id-token: write 
      contents: read
      
    # Opsional namun direkomendasikan: Mengikat eksekusi ke environment GitHub
    environment:
      name: pypi
      url: https://pypi.org/p/smflog # TODO: Ubah dengan nama paket riil

    steps:
      # Mengunduh dan menggabungkan semua wheels dan sdist dari matrix build
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pypi-artifacts-*
          merge-multiple: true

      # Otorisasi OIDC menggunakan official PyPA GitHub Action
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        
