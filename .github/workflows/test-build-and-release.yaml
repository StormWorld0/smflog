name: Maturin Build & Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------
  # 1. SDIST STAGE: Dieksekusi 1 kali saja sebagai SSOT
  # ---------------------------------------------------------
  sdist:
    name: Build Source Distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Install Build Frontend
        run: python -m pip install --upgrade pip build
        
      - name: Build sdist
        run: python -m build --sdist
        
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: pypi-artifacts-sdist
          path: dist/*.tar.gz

  # ---------------------------------------------------------
  # 2. WHEEL STAGE: Dieksekusi secara terdistribusi di Matrix
  # ---------------------------------------------------------
  wheels:
    name: Build Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Rust Cache Manager
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-pep517

      - name: Install Build Frontend
        run: python -m pip install --upgrade pip build
        
      - name: Build wheel
        run: python -m build --wheel
        
      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pypi-artifacts-wheel-${{ matrix.os }}
          path: dist/*.whl

  # ---------------------------------------------------------
  # 3. PUBLISH STAGE: Agregasi dan OIDC Auth
  # ---------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [sdist, wheels]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write 
      contents: read
      
    environment:
      name: pypi
      url: https://pypi.org/p/smflog

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          # 1 sdist + 3 wheels platform
          pattern: pypi-artifacts-*
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
